<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Embedded CSS Animation -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes codeScroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(-130px); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(500%); }
      }
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ledBlink {
        0%, 100% { fill: #10b981; }
        50% { fill: #047857; }
      }
      @keyframes ledBlinkBlue {
        0%, 100% { fill: #00f2fe; }
        50% { fill: #0369a1; }
      }

      .floating-device { animation: floatSlow 6s ease-in-out infinite; }
      .floating-badge-1 { animation: floatFast 4.5s ease-in-out infinite; }
      .floating-badge-2 { animation: floatSlow 5s ease-in-out infinite; animation-delay: 1s; }
      .floating-badge-3 { animation: floatFast 5.5s ease-in-out infinite; animation-delay: 2s; }
      .code-stream { animation: codeScroll 9s linear infinite; }
      .cursor { animation: blinkCursor 0.9s infinite; }
      .ambient-glow { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .scanner { animation: scanline 4s ease-in-out infinite; }
      .led-green { animation: ledBlink 1.2s infinite; }
      .led-blue { animation: ledBlinkBlue 1.6s infinite; }
    </style>
  </defs>

  <!-- Ambient Backdrop Lights -->
  <circle cx="400" cy="240" r="180" fill="url(#neonCyan)" opacity="0.12" filter="url(#softGlow)" class="ambient-glow" />
  <circle cx="200" cy="180" r="120" fill="url(#neonPurple)" opacity="0.12" filter="url(#softGlow)" class="ambient-glow" />

  <!-- Background Grid Lines -->
  <g stroke="rgba(0, 242, 254, 0.07)" stroke-width="1">
    <line x1="50" y1="420" x2="750" y2="420" />
    <line x1="100" y1="450" x2="700" y2="450" />
    <line x1="150" y1="480" x2="650" y2="480" />
    <line x1="200" y1="380" x2="100" y2="480" />
    <line x1="300" y1="380" x2="250" y2="480" />
    <line x1="500" y1="380" x2="550" y2="480" />
    <line x1="600" y1="380" x2="700" y2="480" />
  </g>

  <!-- Ground Tech Pedestal -->
  <ellipse cx="400" cy="420" rx="280" ry="35" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#cyanGlow)" />
  <ellipse cx="400" cy="420" rx="220" ry="25" fill="rgba(0, 242, 254, 0.03)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />

  <!-- Main Floating Laptop / Development Screen Group -->
  <g class="floating-device" transform="translate(0, 0)">
    
    <!-- Laptop Base / Stand -->
    <path d="M 230 380 L 570 380 L 590 395 L 210 395 Z" fill="#141c2e" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <path d="M 370 382 L 430 382 L 430 387 L 370 387 Z" fill="#00f2fe" opacity="0.6" filter="url(#cyanGlow)" />
    
    <!-- Laptop Screen Shell -->
    <rect x="250" y="110" width="300" height="260" rx="16" fill="#0c1322" stroke="rgba(0, 242, 254, 0.5)" stroke-width="2" filter="url(#cyanGlow)" />
    <rect x="258" y="118" width="284" height="244" rx="10" fill="url(#screenGrad)" />
    
    <!-- Screen Header Bar (macOS / IDE Style) -->
    <rect x="258" y="118" width="284" height="26" rx="10" fill="#0e172a" />
    <circle cx="274" cy="131" r="4.5" fill="#ef4444" />
    <circle cx="288" cy="131" r="4.5" fill="#f59e0b" />
    <circle cx="302" cy="131" r="4.5" fill="#10b981" />
    <text x="400" y="135" fill="#64748b" font-family="'Cairo', monospace" font-size="10" text-anchor="middle" font-weight="bold">falcon-cloud-core.js</text>

    <!-- Screen Code Mask -->
    <g transform="translate(268, 155)">
      <clipPath id="screenClip">
        <rect x="0" y="0" width="264" height="195" />
      </clipPath>
      
      <g clip-path="url(#screenClip)">
        <!-- Moving Animated Code Stream -->
        <g class="code-stream" font-family="'Consolas', 'Courier New', monospace" font-size="11">
          <!-- Repeatable Block 1 -->
          <text x="0" y="20" fill="#8b5cf6">const <tspan fill="#38bdf8">falcon</tspan> = <tspan fill="#00f2fe">require</tspan>('<tspan fill="#f59e0b">@falcon/cloud</tspan>');</text>
          <text x="0" y="40" fill="#8b5cf6">async function <tspan fill="#00f2fe">deployWebsite</tspan>() {</text>
          <text x="16" y="60" fill="#64748b">// 🚀 High Speed NVMe SSD</text>
          <text x="16" y="80" fill="#8b5cf6">const <tspan fill="#38bdf8">server</tspan> = <tspan fill="#8b5cf6">await</tspan> falcon.<tspan fill="#00f2fe">init</tspan>({</text>
          <text x="32" y="100" fill="#cbd5e1">uptime: <tspan fill="#10b981">"99.99%"</tspan>,</text>
          <text x="32" y="120" fill="#cbd5e1">firewall: <tspan fill="#10b981">"Anti-DDoS Pro"</tspan>,</text>
          <text x="32" y="140" fill="#cbd5e1">speed: <tspan fill="#00f2fe">"10 Gbps NVMe"</tspan></text>
          <text x="16" y="160" fill="#8b5cf6">});</text>
          <text x="16" y="180" fill="#38bdf8">return <tspan fill="#38bdf8">server</tspan>.<tspan fill="#00f2fe">launch</tspan>();</text>
          <text x="0" y="200" fill="#8b5cf6">}</text>
          
          <text x="0" y="225" fill="#10b981">✔ Build Success in 0.4s [READY]</text>
          <text x="0" y="245" fill="#f59e0b">&gt; Falcon Server Running on :443</text>

          <!-- Repeatable Block 2 for seamless loop -->
          <text x="0" y="280" fill="#8b5cf6">const <tspan fill="#38bdf8">falcon</tspan> = <tspan fill="#00f2fe">require</tspan>('<tspan fill="#f59e0b">@falcon/cloud</tspan>');</text>
          <text x="0" y="300" fill="#8b5cf6">async function <tspan fill="#00f2fe">deployWebsite</tspan>() {</text>
          <text x="16" y="320" fill="#64748b">// 🚀 High Speed NVMe SSD</text>
          <text x="16" y="340" fill="#8b5cf6">const <tspan fill="#38bdf8">server</tspan> = <tspan fill="#8b5cf6">await</tspan> falcon.<tspan fill="#00f2fe">init</tspan>({</text>
          <text x="32" y="360" fill="#cbd5e1">uptime: <tspan fill="#10b981">"99.99%"</tspan>,</text>
          <text x="32" y="380" fill="#cbd5e1">firewall: <tspan fill="#10b981">"Anti-DDoS Pro"</tspan></text>
          <text x="16" y="400" fill="#8b5cf6">});</text>
          <text x="0" y="420" fill="#8b5cf6">}</text>
        </g>
      </g>
    </g>

    <!-- Glowing Scanline running down screen -->
    <rect x="258" y="144" width="284" height="2" fill="url(#neonCyan)" opacity="0.3" class="scanner" />
  </g>

  <!-- Left Side: Holographic Server Tower with Blinking LEDs -->
  <g class="floating-badge-2" transform="translate(100, 190)">
    <rect x="0" y="0" width="85" height="150" rx="12" fill="#0d1424" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <!-- Server Trays -->
    <rect x="10" y="15" width="65" height="25" rx="6" fill="#131c33" stroke="rgba(255,255,255,0.06)" />
    <circle cx="22" cy="27" r="3" class="led-green" />
    <circle cx="32" cy="27" r="3" class="led-blue" />
    <line x1="45" y1="27" x2="65" y2="27" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="10" y="48" width="65" height="25" rx="6" fill="#131c33" stroke="rgba(255,255,255,0.06)" />
    <circle cx="22" cy="60" r="3" class="led-green" />
    <circle cx="32" cy="60" r="3" class="led-blue" />
    <line x1="45" y1="60" x2="65" y2="60" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="10" y="81" width="65" height="25" rx="6" fill="#131c33" stroke="rgba(255,255,255,0.06)" />
    <circle cx="22" cy="93" r="3" class="led-blue" />
    <circle cx="32" cy="93" r="3" class="led-green" />
    <line x1="45" y1="93" x2="65" y2="93" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="10" y="114" width="65" height="22" rx="6" fill="#090e1a" />
    <text x="42" y="129" fill="#00f2fe" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" text-anchor="middle">NVMe PRO</text>
  </g>

  <!-- Floating Holographic Tech Badges -->
  <!-- Badge 1: React / JavaScript -->
  <g class="floating-badge-1" transform="translate(580, 130)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="rgba(14, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <circle cx="22" cy="21" r="10" fill="rgba(0, 242, 254, 0.15)" />
    <text x="22" y="25" fill="#00f2fe" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
    <text x="42" y="20" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800">برمجة المواقع</text>
    <text x="42" y="32" fill="#00f2fe" font-family="'Cairo', sans-serif" font-size="9" font-weight="bold">React &amp; Node.js</text>
  </g>

  <!-- Badge 2: Cloud Uptime 99.9% -->
  <g class="floating-badge-3" transform="translate(590, 250)">
    <rect x="0" y="0" width="135" height="44" rx="12" fill="rgba(14, 23, 42, 0.85)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <circle cx="24" cy="22" r="10" fill="rgba(16, 185, 129, 0.15)" />
    <circle cx="24" cy="22" r="4" class="led-green" />
    <text x="44" y="20" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800">استضافة فائقة</text>
    <text x="44" y="33" fill="#10b981" font-family="'Cairo', sans-serif" font-size="9" font-weight="bold">استقرار 99.9%</text>
  </g>

  <!-- Badge 3: Bot API -->
  <g class="floating-badge-1" transform="translate(80, 90)">
    <rect x="0" y="0" width="125" height="40" rx="12" fill="rgba(14, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <text x="20" y="25" fill="#f59e0b" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">⚡</text>
    <text x="38" y="19" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="11" font-weight="800">بوتات ذكية</text>
    <text x="38" y="31" fill="#f59e0b" font-family="'Cairo', sans-serif" font-size="9" font-weight="bold">Discord &amp; Telegram</text>
  </g>

  <!-- Circuit Connection Lines -->
  <path d="M 185 240 Q 220 240 248 240" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4" />
  <path d="M 552 240 Q 570 240 590 260" stroke="url(#neonPurple)" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4" />
</svg>
